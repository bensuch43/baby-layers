<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby Layers — How many layers today?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:    #1c2b3a;
    --muted:  #7a92a8;
    --accent: #e47a50;
    --card:   rgba(255,255,255,0.82);
    --r:      26px;
  }

  html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; color: var(--ink); }

  body {
    background: linear-gradient(135deg, #c8deff, #dff0ff, #fde8d8);
    background-size: 400% 400%;
    animation: bgShift 14s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 32px 20px 48px;
  }
  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.35; pointer-events: none; z-index: 0; }
  .blob-a { width: 480px; height: 480px; background: #b6d0ff; top: -160px; left: -100px; animation: floatA 16s ease-in-out infinite alternate; }
  .blob-b { width: 360px; height: 360px; background: #ffd3b8; bottom: -100px; right: -80px; animation: floatB 13s ease-in-out infinite alternate; }
  @keyframes floatA { from { transform: translate(0,0); } to { transform: translate(40px,30px); } }
  @keyframes floatB { from { transform: translate(0,0); } to { transform: translate(-30px,-20px); } }

  .card {
    position: relative; z-index: 1;
    background: var(--card);
    backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
    border: 1px solid rgba(255,255,255,0.88);
    border-radius: var(--r);
    padding: 44px 40px;
    max-width: 460px; width: 100%;
    box-shadow: 0 16px 56px rgba(60,100,160,0.12), 0 1px 0 rgba(255,255,255,0.9) inset;
  }

  .eyebrow { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  h1 { font-family: 'Lora', serif; font-size: 40px; font-weight: 400; line-height: 1.1; color: var(--ink); margin-bottom: 30px; }
  h1 em { color: var(--accent); font-style: italic; }

  .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .search-input {
    flex: 1; padding: 13px 16px; border-radius: 14px;
    border: 1.5px solid rgba(170,200,240,0.55);
    background: rgba(255,255,255,0.65);
    font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink);
    outline: none; transition: border-color 0.2s;
  }
  .search-input:focus { border-color: rgba(170,200,240,0.9); }
  .search-btn {
    padding: 13px 22px; border-radius: 14px; border: none;
    background: var(--ink); color: white; font-size: 16px;
    cursor: pointer; flex-shrink: 0; transition: background 0.2s, transform 0.1s;
  }
  .search-btn:hover:not(:disabled) { background: #2e4057; transform: translateY(-1px); }
  .search-btn:active { transform: translateY(0); }
  .search-btn:disabled { background: var(--muted); cursor: not-allowed; }

  .suggestions { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .sug-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 12px; font-family: 'DM Sans', sans-serif; text-decoration: underline; padding: 0; }

  .status-msg { font-size: 12.5px; color: var(--muted); margin-top: 10px; display: none; }
  .status-msg.visible { display: block; }

  .error-box { background: #fff0f0; border: 1px solid #ffcaca; border-radius: 13px; padding: 13px 16px; font-size: 13px; color: #c0392b; margin-top: 14px; display: none; }
  .error-box.visible { display: block; }

  #results { display: none; margin-top: 22px; }
  #results.visible { display: block; animation: fadeUp 0.45s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  .weather-strip {
    background: rgba(210,232,255,0.45); border: 1px solid rgba(170,210,255,0.38);
    border-radius: 18px; padding: 16px 20px; display: flex; align-items: center;
    gap: 14px; margin-bottom: 16px;
  }
  .w-emoji { font-size: 40px; line-height: 1; flex-shrink: 0; }
  .w-temp { font-family: 'Lora', serif; font-size: 30px; color: var(--ink); line-height: 1; }
  .w-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .w-loc { font-size: 11px; color: var(--muted); margin-top: 2px; opacity: 0.85; }

  .slider-box {
    background: rgba(255,255,255,0.55); border: 1px solid rgba(190,215,245,0.5);
    border-radius: 16px; padding: 14px 18px; margin-bottom: 16px;
  }
  .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .slider-title { font-size: 13px; font-weight: 500; color: var(--ink); }
  .slider-val { font-family: 'Lora', serif; font-size: 20px; color: var(--accent); }
  .slider-val small { font-family: 'DM Sans', sans-serif; font-size: 10px; color: var(--muted); margin-left: 3px; }
  input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .slider-footer { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 5px; }
  .reset-link { background: none; border: none; color: var(--accent); font-size: 11px; font-family: 'DM Sans', sans-serif; cursor: pointer; text-decoration: underline; padding: 0; display: none; }
  .reset-link.visible { display: inline; }

  .layer-count {
    background: rgba(255,237,226,0.65); border: 1.5px solid rgba(228,122,80,0.2);
    border-radius: 20px; padding: 18px 22px; display: flex; align-items: center;
    gap: 16px; margin-bottom: 14px;
  }
  .layer-num { font-family: 'Lora', serif; font-size: 56px; color: var(--accent); line-height: 1; flex-shrink: 0; }
  .layer-lbl strong { display: block; font-size: 15px; font-weight: 600; color: var(--ink); }
  .layer-lbl span { font-size: 12px; color: var(--muted); }

  .items-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
  .item-row {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.62); border: 1px solid rgba(190,215,245,0.45);
    border-radius: 13px; padding: 11px 15px;
  }
  .item-emoji { font-size: 22px; flex-shrink: 0; }
  .item-name { font-size: 14px; font-weight: 500; color: var(--ink); }
  .item-desc { font-size: 12px; color: var(--muted); }

  .tip-box {
    background: rgba(210,232,255,0.38); border: 1px solid rgba(170,210,255,0.32);
    border-radius: 13px; padding: 13px 16px; font-size: 13px; color: #5a7a90;
    line-height: 1.6; margin-bottom: 12px;
  }

  .neck-check {
    background: rgba(228,122,80,0.06); border: 1px solid rgba(228,122,80,0.18);
    border-radius: 13px; padding: 13px 15px; font-size: 13px; color: var(--ink);
    display: flex; gap: 10px; line-height: 1.55; margin-bottom: 16px;
  }

  .reset-btn {
    width: 100%; padding: 13px; border-radius: 14px;
    border: 1.5px solid rgba(190,215,245,0.55);
    background: transparent; color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    cursor: pointer; transition: background 0.15s;
  }
  .reset-btn:hover { background: rgba(255,255,255,0.5); }

  .dots { display: inline-flex; gap: 4px; align-items: center; vertical-align: middle; }
  .dots span { width: 5px; height: 5px; background: white; border-radius: 50%; animation: dot 1.2s ease-in-out infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-5px);opacity:1} }

  footer { position: relative; z-index: 1; margin-top: 24px; font-size: 11.5px; color: rgba(100,130,160,0.7); text-align: center; line-height: 1.6; }
  footer a { color: rgba(100,130,160,0.85); }

  @media (max-width: 480px) {
    .card { padding: 32px 24px; }
    h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="blob blob-a"></div>
<div class="blob blob-b"></div>

<div class="card">
  <p class="eyebrow">Baby care</p>
  <h1>How many <em>layers</em><br>today?</h1>

  <div class="search-row">
    <input class="search-input" id="locationInput" type="text"
      placeholder="Enter town, city or postcode…"
      onkeydown="if(event.key==='Enter')doSearch()" />
    <button class="search-btn" id="searchBtn" onclick="doSearch()">→</button>
  </div>
  <p class="suggestions">
    e.g. <button class="sug-btn" onclick="setLoc('Windsor')">Windsor</button>,
    <button class="sug-btn" onclick="setLoc('SL4 1AA')">SL4</button>,
    <button class="sug-btn" onclick="setLoc('London')">London</button>
  </p>
  <p class="status-msg" id="statusMsg"></p>
  <div class="error-box" id="errorBox"></div>

  <div id="results">
    <div class="weather-strip">
      <span class="w-emoji" id="wEmoji"></span>
      <div>
        <div class="w-temp" id="wTemp"></div>
        <div class="w-sub"  id="wSub"></div>
        <div class="w-loc"  id="wLoc"></div>
      </div>
    </div>

    <div class="slider-box">
      <div class="slider-header">
        <span class="slider-title">🌡️ Feels-like temperature</span>
        <span class="slider-val" id="sliderVal">—</span>
      </div>
      <input type="range" min="-10" max="35" id="tempSlider" oninput="onSlider()" />
      <div class="slider-footer">
        <span>−10°C</span>
        <button class="reset-link" id="resetLink" onclick="resetSlider()">reset to fetched temp</button>
        <span>35°C</span>
      </div>
    </div>

    <div class="layer-count">
      <div class="layer-num" id="layerNum"></div>
      <div class="layer-lbl">
        <strong id="layerLabel"></strong>
        <span>layers recommended</span>
      </div>
    </div>

    <div class="items-list" id="itemsList"></div>
    <div class="tip-box"   id="tipBox"></div>

    <div class="neck-check">
      <span style="font-size:18px;flex-shrink:0;margin-top:1px">🤚</span>
      <div><strong>Quick check:</strong> Feel the back of baby's neck — it should be warm, not hot or clammy. Adjust one layer at a time.</div>
    </div>

    <button class="reset-btn" onclick="resetAll()">↩ Search another location</button>
  </div>
</div>

<footer>
  Weather data by <a href="https://open-meteo.com" target="_blank">Open-Meteo</a> &amp;
  <a href="https://nominatim.org" target="_blank">Nominatim</a> — completely free, no accounts needed
</footer>

<script>
  let fetchedFeelsLike = null;
  let currentWindspeed = 0;
  let currentIsRainy   = false;

  // ── UI helpers ──────────────────────────────────────────────
  function setLoc(v) { document.getElementById('locationInput').value = v; }

  function showError(msg) {
    const b = document.getElementById('errorBox');
    b.textContent = '⚠️ ' + msg;
    b.classList.add('visible');
  }
  function hideError() { document.getElementById('errorBox').classList.remove('visible'); }

  function setStatus(msg) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg || '';
    el.classList.toggle('visible', !!msg);
  }

  // ── Weather helpers ─────────────────────────────────────────
  function weatherEmoji(code) {
    if (code === 0)         return '☀️';
    if (code <= 2)          return '🌤️';
    if (code <= 3)          return '☁️';
    if (code <= 49)         return '🌫️';
    if (code <= 59)         return '🌦️';
    if (code <= 69)         return '🌧️';
    if (code <= 79)         return '🌨️';
    if (code <= 82)         return '🌧️';
    if (code <= 86)         return '❄️';
    if (code <= 99)         return '⛈️';
    return '🌡️';
  }

  function weatherDesc(code) {
    if (code === 0)  return 'Clear sky';
    if (code <= 2)   return 'Partly cloudy';
    if (code <= 3)   return 'Overcast';
    if (code <= 49)  return 'Foggy';
    if (code <= 59)  return 'Drizzle';
    if (code <= 69)  return 'Rainy';
    if (code <= 79)  return 'Snowy';
    if (code <= 82)  return 'Rain showers';
    if (code <= 86)  return 'Snow showers';
    if (code <= 99)  return 'Thunderstorm';
    return 'Mixed';
  }

  // ── Layer logic ─────────────────────────────────────────────
  function getRecommendation(feelsLike) {
    const windy = currentWindspeed > 20;
    const rainy = currentIsRainy;
    let layers, label, tip, items;

    if (feelsLike >= 24) {
      layers = 1; label = 'Just a bodysuit';
      tip = `At ${feelsLike}°C it's warm — babies overheat easily. One light layer is plenty.`;
      items = [{ e:'👕', n:'Short-sleeve bodysuit', d:'Light cotton, fits snugly' }];
    } else if (feelsLike >= 18) {
      layers = 2; label = 'Bodysuit + light layer';
      tip = `At ${feelsLike}°C it's mild. A bodysuit plus one light layer keeps baby comfortable.`;
      items = [
        { e:'👕', n:'Short-sleeve bodysuit',      d:'Base layer, close to skin' },
        { e:'🧥', n:'Light sleepsuit or cardigan', d:'Thin cotton or jersey' },
      ];
    } else if (feelsLike >= 12) {
      layers = 3; label = 'Bodysuit + outfit + jacket';
      tip = `At ${feelsLike}°C${windy ? ' with wind' : ''} baby needs a mid layer. A hat is a good idea outdoors.`;
      items = [
        { e:'👕', n:'Long-sleeve bodysuit',        d:'Warm base layer' },
        { e:'👖', n:'Fleece sleepsuit or outfit',  d:'Mid-weight layer' },
        { e:'🧥', n:'Light jacket or snowsuit',    d: windy ? 'Windproof if possible' : 'Cotton or light fleece' },
      ];
    } else if (feelsLike >= 4) {
      layers = 4; label = 'Full cold-weather bundle';
      tip = `At ${feelsLike}°C it's cold. Always add a hat — babies lose a lot of heat from their head.`;
      items = [
        { e:'👕', n:'Long-sleeve vest/bodysuit',  d:'Thermal base layer' },
        { e:'👖', n:'Fleece sleepsuit',           d:'Warm mid layer' },
        { e:'🧥', n:'Padded coat or pram suit',   d:'Wind & water resistant' },
        { e:'🧢', n:'Warm hat + mittens',         d:'Essential — babies lose heat fast' },
      ];
    } else {
      layers = 5; label = "Maximum layers — it's freezing";
      tip = `At ${feelsLike}°C limit time outdoors. Use a footmuff in the pram.`;
      items = [
        { e:'👕', n:'Thermal long-sleeve vest',   d:'Close-fitting base layer' },
        { e:'👖', n:'Fleece sleepsuit',           d:'Warm mid layer' },
        { e:'🧥', n:'Padded snowsuit',            d:'Full-body insulation' },
        { e:'🧢', n:'Warm hat + mittens',         d:'Cover head and hands' },
        { e:'🛷', n:'Pram footmuff or blanket',   d:'Extra insulation in pram' },
      ];
    }

    if (rainy) tip += " Don't forget a rain cover for the pram.";
    return { layers, label, tip, items };
  }

  function renderRec(feelsLike) {
    const r = getRecommendation(feelsLike);
    document.getElementById('layerNum').textContent   = r.layers;
    document.getElementById('layerLabel').textContent = r.label;
    document.getElementById('tipBox').innerHTML = `<strong>💡 Why?</strong> ${r.tip}`;
    document.getElementById('itemsList').innerHTML = r.items.map(i => `
      <div class="item-row">
        <span class="item-emoji">${i.e}</span>
        <div>
          <div class="item-name">${i.n}</div>
          <div class="item-desc">${i.d}</div>
        </div>
      </div>`).join('');
  }

  // ── Slider ──────────────────────────────────────────────────
  function onSlider() {
    const val    = Number(document.getElementById('tempSlider').value);
    const manual = val !== fetchedFeelsLike;
    document.getElementById('sliderVal').innerHTML =
      `${val}°C${manual ? '<small> manual</small>' : ''}`;
    document.getElementById('resetLink').classList.toggle('visible', manual);
    renderRec(val);
  }

  function resetSlider() {
    document.getElementById('tempSlider').value = fetchedFeelsLike;
    document.getElementById('sliderVal').innerHTML = `${fetchedFeelsLike}°C`;
    document.getElementById('resetLink').classList.remove('visible');
    renderRec(fetchedFeelsLike);
  }

  // ── Main search ─────────────────────────────────────────────
  async function doSearch() {
    const loc = document.getElementById('locationInput').value.trim();
    if (!loc) { hideError(); showError('Please enter a location.'); return; }

    hideError();
    setStatus('📍 Finding location…');
    const btn = document.getElementById('searchBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
    document.getElementById('results').classList.remove('visible');

    try {
      // 1. Geocode with Nominatim
      const geoRes = await fetch(
        `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(loc)}&format=json&limit=1`,
        { headers: { 'Accept-Language': 'en', 'User-Agent': 'BabyLayersApp/1.0' } }
      );
      const geoData = await geoRes.json();
      if (!geoData.length) throw new Error(`Couldn't find "${loc}" — try a nearby town or city name.`);

      const { lat, lon, display_name } = geoData[0];
      const placeName = display_name.split(',').slice(0, 2).join(', ');

      // 2. Fetch weather from Open-Meteo
      setStatus('🌤️ Fetching weather…');
      const meteoRes = await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&current=temperature_2m,apparent_temperature,weathercode,windspeed_10m&timezone=auto`
      );
      if (!meteoRes.ok) throw new Error('Weather data unavailable. Please try again shortly.');
      const meteo = await meteoRes.json();
      const c = meteo.current;

      const w = {
        temp:      Math.round(c.temperature_2m),
        feelsLike: Math.round(c.apparent_temperature),
        windspeed: c.windspeed_10m,
        code:      c.weathercode,
        isRainy:   c.weathercode >= 50 && c.weathercode <= 99,
        location:  placeName,
      };

      // 3. Populate UI
      document.getElementById('wEmoji').textContent = weatherEmoji(w.code);
      document.getElementById('wTemp').textContent  = `${w.temp}°C`;
      document.getElementById('wSub').textContent   = `Feels like ${w.feelsLike}°C · ${weatherDesc(w.code)}`;
      document.getElementById('wLoc').textContent   = `📍 ${w.location}`;

      fetchedFeelsLike = w.feelsLike;
      currentWindspeed = w.windspeed;
      currentIsRainy   = w.isRainy;

      document.getElementById('tempSlider').value = w.feelsLike;
      document.getElementById('sliderVal').innerHTML = `${w.feelsLike}°C`;
      document.getElementById('resetLink').classList.remove('visible');

      renderRec(w.feelsLike);
      setStatus(null);
      document.getElementById('results').classList.add('visible');

    } catch (e) {
      setStatus(null);
      showError(e.message || 'Something went wrong. Please try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = '→';
    }
  }

  function resetAll() {
    document.getElementById('results').classList.remove('visible');
    document.getElementById('locationInput').value = '';
    hideError();
    setStatus(null);
  }
</script>
</body>
</html>
